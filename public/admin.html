<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173c3f"><title>Administración | La Soffi</title><link rel="stylesheet" href="/styles.css"></head><body class="admin-page">
<div id="login" class="login-screen"><form id="loginForm" class="login-box"><img src="/assets/la-soffi-logo.png" alt="La Soffi"><h2>Panel administrador</h2><p>Gestiona productos, fotos, precios y datos del catálogo.</p><input id="user" value="admin" placeholder="Usuario" autocomplete="username"><input id="password" type="password" placeholder="Contraseña" autocomplete="current-password"><div id="loginError" class="error"></div><button>Ingresar</button></form></div>
<div class="admin-shell"><aside class="sidebar"><img class="sidebar-logo" src="/assets/la-soffi-logo.png" alt="La Soffi"><h1>La Soffi</h1><p>Catálogo administrable</p><a class="side-link" href="/catalogo" target="_blank">↗ Ver catálogo</a><a class="side-link" href="/">⌂ Ver portada</a><button id="logout" class="side-link" style="width:100%;border:0;color:#fff;text-align:left">Salir</button></aside><main class="admin-main"><div class="admin-top"><div><h2>Productos</h2><span id="stats"></span></div><button id="newBtn" class="btn teal">+ Nuevo producto</button></div>
<section class="admin-card"><form id="productForm"><input type="hidden" id="editId"><div class="form-grid"><div class="field"><label>Nombre</label><input id="name" required></div><div class="field"><label>Categoría</label><input id="category" list="categories" required><datalist id="categories"></datalist></div><div class="field"><label>Precio numérico</label><input id="price" type="number" min="0" step="0.01"></div><div class="field"><label>Texto de precio</label><input id="priceLabel" placeholder="Ej. S/48 · S/38 · S/28"></div><div class="field full"><label>Descripción</label><textarea id="description"></textarea></div><div class="field"><label>Imagen</label><input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp"><input id="image" placeholder="/uploads/imagen.jpg"></div><div class="field"><label>Estado</label><select id="active"><option value="true">Visible</option><option value="false">Oculto</option></select><label style="margin-top:8px"><input id="featured" type="checkbox"> Producto destacado</label></div></div><div class="admin-actions"><button class="btn teal" id="saveBtn">Guardar producto</button><button type="button" class="btn ghost" id="cancelBtn">Limpiar</button></div></form></section>
<section class="admin-card"><div class="search-wrap"><input id="adminSearch" class="search" placeholder="Buscar producto..."></div><div id="productList" class="products-table"></div></section></main></div><div id="toast" class="toast"></div>
<script src="/admin.js"></script></body></html>
